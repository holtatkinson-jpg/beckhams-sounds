<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Beckham's Sounds</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Spin the globe and hear emergency vehicle sirens from around the world.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#071226">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Beckham's Sounds">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css?v=11">
</head>
<body>

  <!-- HOME: the globe -->
  <main id="home">
    <header class="top">
      <h1><span class="beacon">🚨</span> Beckham's Sounds</h1>
      <div class="top-right">
        <div class="passport" id="passport" aria-label="Countries visited"></div>
      </div>
    </header>

    <nav class="activities" aria-label="Things to do">
      <button class="act act-mission" id="open-mission">🚨 Missions</button>
      <button class="act act-fly" id="open-fly">✈️ Fly There</button>
      <button class="act act-find" id="open-find">🧭 Find It!</button>
      <button class="act play-pill" id="open-game">🎮 Guess the Siren</button>
      <button class="act make-pill" id="open-maker">🎛️ Siren Maker</button>
      <button class="act" id="open-cards">📒 Cards</button>
      <button class="act" id="open-garage">⭐ My Garage</button>
    </nav>

    <div id="globe-wrap">
      <canvas id="globe" aria-label="World globe"></canvas>
      <div id="pins"></div>
      <div class="hint" id="hint">👆 Spin the globe and tap a flag!</div>
      <div class="mode-bar" id="mode-bar" hidden>
        <span id="mode-text"></span>
        <button class="pill small" id="mode-action"></button>
        <button class="pill small" id="mode-quit" aria-label="Stop">✖</button>
      </div>
      <div class="trip-card" id="trip-card" hidden></div>
      <button class="credits-btn" id="open-credits">ℹ️ Credits</button>
      <div class="zoom">
        <button id="zoom-in" aria-label="Zoom in">+</button>
        <button id="zoom-out" aria-label="Zoom out">−</button>
      </div>
    </div>

    <nav id="flag-strip" aria-label="Countries"></nav>
  </main>

  <!-- STATION: one country's vehicles and sounds -->
  <section id="station" class="sheet" aria-hidden="true">
    <header class="sheet-top">
      <button class="pill back" data-close>🌍 Globe</button>
      <h2 id="station-title"></h2>
      <button class="pill" data-garage>⭐ My Garage</button>
    </header>
    <div class="tabs" id="tabs"></div>
    <div class="stage" id="stage">
      <div class="says" id="says"></div>
      <div class="vehicle" id="vehicle"></div>
      <div class="road"></div>
    </div>
    <div class="say-row" id="say-row" hidden></div>
    <div class="pads" id="pads"></div>
    <div class="actions">
      <p class="fact" id="fact"></p>
      <button class="big-btn drive" id="drive-by">🏁 Drive By!</button>
      <button class="big-btn stop" id="stop">⏹ Stop</button>
    </div>
  </section>

  <!-- GARAGE: favourite sounds -->
  <section id="garage" class="sheet" aria-hidden="true">
    <header class="sheet-top">
      <button class="pill back" data-close>⬅ Back</button>
      <h2>⭐ Beckham's Garage</h2>
      <button class="pill stop-pill" id="garage-stop">⏹ Stop</button>
    </header>
    <div class="garage-grid" id="garage-grid"></div>
  </section>

  <!-- GAME: guess the siren -->
  <section id="game" class="sheet" aria-hidden="true">
    <header class="sheet-top">
      <button class="pill back" data-close>⬅ Back</button>
      <h2>🎮 Guess the Siren</h2>
      <div class="passport" id="trophies" aria-label="Trophies"></div>
    </header>
    <div class="game-body" id="game-body"></div>
  </section>

  <!-- MAKER: build your own siren -->
  <section id="maker" class="sheet" aria-hidden="true">
    <header class="sheet-top">
      <button class="pill back" data-close>⬅ Back</button>
      <h2>🎛️ Siren Maker</h2>
      <button class="pill" id="maker-random">🎲 Surprise me</button>
    </header>
    <div class="stage" id="maker-stage">
      <div class="vehicle" id="maker-vehicle"></div>
      <div class="road"></div>
    </div>
    <div class="seg" id="maker-type"></div>
    <div class="sliders">
      <label class="slider"><span>🐻 Low note <b id="mk-lo-val"></b></span>
        <input type="range" id="mk-lo" data-k="lo" min="200" max="900" step="10"></label>
      <label class="slider"><span>🐭 High note <b id="mk-hi-val"></b></span>
        <input type="range" id="mk-hi" data-k="hi" min="400" max="2000" step="10"></label>
      <label class="slider"><span>🐢 Speed 🐇 <b id="mk-speed-val"></b></span>
        <input type="range" id="mk-speed" data-k="speed" min="0" max="100" step="1"></label>
    </div>
    <div class="maker-opts">
      <div class="seg small" id="maker-wave"></div>
      <div class="seg small" id="maker-kind"></div>
      <div class="swatches" id="maker-colors"></div>
    </div>
    <div class="actions">
      <button class="big-btn next" id="maker-play">▶ Play</button>
      <button class="big-btn drive" id="maker-drive">🏁 Drive By!</button>
      <button class="big-btn save" id="maker-save">⭐ Save to Garage</button>
    </div>
  </section>

  <!-- MISSION: answer the call -->
  <section id="mission" class="sheet" aria-hidden="true">
    <header class="sheet-top">
      <button class="pill back" data-close>⬅ Back</button>
      <h2>🚨 Rescue Mission</h2>
      <div class="passport" id="mission-count" aria-label="Missions finished"></div>
    </header>
    <div class="game-body" id="mission-body"></div>
  </section>

  <!-- CARDS: facts and stickers for each country -->
  <section id="cards" class="sheet" aria-hidden="true">
    <header class="sheet-top">
      <button class="pill back" data-close>⬅ Back</button>
      <h2>📒 Country Cards</h2>
      <div class="passport" id="sticker-count" aria-label="Stickers collected"></div>
    </header>
    <p class="cards-key">Collect four stickers in every country: 🛂 visit it · 🔊 hear every sound · 🚨 finish a mission · ✈️ fly there</p>
    <div class="cards-grid" id="cards-grid"></div>
  </section>

  <!-- CREDITS: for grown-ups -->
  <section id="credits" class="sheet" aria-hidden="true">
    <header class="sheet-top">
      <button class="pill back" data-close>⬅ Back</button>
      <h2>ℹ️ Credits</h2>
      <span class="spacer"></span>
    </header>
    <div class="credits-body" id="credits-body"></div>
  </section>

  <div class="toast" id="toast"></div>

  <script src="vendor/d3.min.js"></script>
  <script src="vendor/topojson-client.min.js"></script>
  <script src="js/data.js?v=11"></script>
  <script src="js/word-credits.js?v=11"></script>
  <script src="js/sirens.js?v=8"></script>
  <script src="js/vehicles.js?v=8"></script>
  <script src="js/app.js?v=11"></script>
  <script src="js/explore.js?v=11"></script>
</body>
</html>
